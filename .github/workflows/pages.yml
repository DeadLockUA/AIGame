name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Включён ли GitHub Pages
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::notice::GitHub Pages не включён (Settings → Pages → Source: GitHub Actions). Публикация пропущена."; fi
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: steps.check.outputs.enabled == 'true'
        run: node tools/build-precache.mjs
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: game }
      - if: steps.check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
