name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: precache актуален
        run: |
          node tools/build-precache.mjs
          git diff --exit-code game/precache.json || (echo "Запусти npm run precache и закоммить" && exit 1)
  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: CHROME="$(node -e "import('playwright').then(m=>console.log(m.chromium.executablePath()))")" npm run e2e && CHROME="$(node -e "import('playwright').then(m=>console.log(m.chromium.executablePath()))")" npm run e2e:extra
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-shots, path: /tmp/e2e-shots }
